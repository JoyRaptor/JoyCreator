# Avatar Studio on a cloud Android emulator: builds the debug app and its instrumented tests in this run, boots an
# API 30 x86_64 emulator (software GL: -gpu guest, which reports ANGLE on SwiftShader Vulkan; the arm64 app runs through the image's ARM translation), installs both and runs
# the avatar tests (app/src/androidTest/java/cc/joycreator/avatar/emu/):
#   AvatarDrawParityTest  Topps and Pip, five poses, solved and drawn with CharacterGl, against the web pilot's pictures
#   AvatarRoomSmokeTest   the room opens with Topps, real taps through the four stages, then Pip the same way
# Pictures (phone, pilot difference, room screenshots), the instrument output and logcat are the run's artifact.
#
# Started by:  .\tools\cloud-build.ps1 avatar-emu <ref> [tests] [fault] [device] [gpu] [msaa]   (or the Actions tab, "Run workflow"),
# and by itself on a push that touches the avatar code or these tests.
# Rules as build.yml: never signs, no secrets, the logs are public (print nothing from the PC).
# What an emulator cannot show: pen pressure and tilt, the phone's real GPU (Adreno/Mali precision and speed), camera,
# mic, temperatures. Those stay on the Note 9.
name: Avatar emulator tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build and test
        required: true
        default: joy-creator
      tests:
        description: "all, draw (AvatarDrawParityTest), room (AvatarRoomSmokeTest), studio (AvatarStudioDrawTest), face (AvatarFaceReplayTest: his face take in the room), or a test class name"
        required: false
        default: all
      fault:
        description: "Planted fault to prove the tests can fail: none, shift (one piece drawn 2 px off), rest (Studio draws only the standing picture) or flip (the face test plays his head turns the other way round)"
        required: false
        default: none
      device:
        description: "Emulator profile (avdmanager device id): pixel_4 (phone) or pixel_tablet"
        required: false
        default: pixel_4
      orientation:
        description: "portrait or landscape (the emulator's screen is turned; the app follows)"
        required: false
        default: portrait
      gpu:
        description: "Emulator GL: guest (ANGLE on SwiftShader Vulkan inside the emulator; the steady one), swiftshader_indirect or swiftshader (host SwiftShader: froze the emulator in 2 of 4 runs)"
        required: false
        default: guest
      msaa:
        description: "Samples for the off-screen drawing in AvatarDrawParityTest: 4 or 0"
        required: false
        default: '4'
      request_id:
        description: Tag that tools/cloud-build.ps1 uses to find its run (any short text)
        required: false
        default: manual
  push:
    paths:
      - .github/workflows/avatar-emulator.yml
      - app/src/androidTest/**
      - app/src/main/java/cc/joycreator/avatar/**
      - app/src/main/assets/avatar/**
      - app/src/main/res/values/strings_avatar*.xml

run-name: "avatar emulator ${{ inputs.tests || 'all' }} fault=${{ inputs.fault || 'none' }} ${{ inputs.device || 'pixel_4' }} ${{ inputs.orientation || 'portrait' }} @ ${{ inputs.ref || github.ref_name }} [${{ inputs.request_id || 'push' }}]"

concurrency:
  group: avatar-emulator-${{ inputs.ref || github.ref }}-${{ inputs.fault || 'none' }}-${{ inputs.device || 'pixel_4' }}-${{ inputs.orientation || 'portrait' }}-${{ inputs.gpu || 'guest' }}-${{ inputs.msaa || '4' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  WHISPER_REPO: https://github.com/ggml-org/whisper.cpp.git
  WHISPER_SHA: df7638d8229a243af8a4b5a8ae557e0d74e0a0ae
  MEDIA3_REPO: https://github.com/anonfaded/media3-patched.git
  MEDIA3_SHA: 0bdf7e73051142f3d5dd5eb8fefce39178fe8a10
  PKG: com.fadcam.beta
  RUNNER_CLASS: androidx.test.runner.AndroidJUnitRunner

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Note the commit
        id: meta
        env:
          DEVICE: ${{ inputs.device || 'pixel_4' }}
          ORIENT: ${{ inputs.orientation || 'portrait' }}
        run: |
          echo "sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
          # the artifact's name: <sha>-<fault>, plus the screen when it is not the default phone upright
          shape="$DEVICE"; [ "$ORIENT" != portrait ] && shape="$shape-$ORIENT"
          if [ "$shape" = pixel_4 ]; then echo "shape=" >> "$GITHUB_OUTPUT"; else echo "shape=-$shape" >> "$GITHUB_OUTPUT"; fi
          echo "Testing $(git rev-parse HEAD)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK parts (platform 36, NDK, CMake, emulator, API 30 image)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" \
            emulator platform-tools "system-images;android-30;google_apis;x86_64" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Outside sources (whisper.cpp, patched Media3)
        run: |
          fetch_at() {  # repo sha dir
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "$1" "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          fetch_at "$WHISPER_REPO" "$WHISPER_SHA" "$RUNNER_TEMP/whisper.cpp"
          fetch_at "$MEDIA3_REPO" "$MEDIA3_SHA" "$RUNNER_TEMP/media3-patched"
          git -C "$RUNNER_TEMP/media3-patched" apply --whitespace=nowarn "$GITHUB_WORKSPACE/tools/cloud/media3-fadcam.patch"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "media3.patched.path=$RUNNER_TEMP/media3-patched"
            echo "whisper.cpp.path=$RUNNER_TEMP/whisper.cpp"
          } > local.properties

      - name: Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle settings for this runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.workers.max=4"
            echo "kotlin.daemon.jvmargs=-Xmx3g"
          } >> ~/.gradle/gradle.properties

      - name: Build the debug app and its instrumented tests
        run: |
          START=$(date +%s)
          ./gradlew :app:assembleDefaultDebug :app:assembleDefaultDebugAndroidTest --stacktrace
          echo "gradle: $(( ($(date +%s) - START + 59) / 60 )) min"
          ./gradlew --stop > /dev/null 2>&1 || true   # its memory goes to the emulator

      - name: Boot the emulator (API 30, x86_64, software GL)
        timeout-minutes: 12
        env:
          DEVICE: ${{ inputs.device || 'pixel_4' }}
          GPU: ${{ inputs.gpu || 'guest' }}
          ORIENT: ${{ inputs.orientation || 'portrait' }}
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name avatar \
            --package 'system-images;android-30;google_apis;x86_64' --device "$DEVICE"
          printf 'hw.ramSize=3072\ndisk.dataPartition.size=4G\nhw.keyboard=yes\n' >> "$ANDROID_AVD_HOME/avatar.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd avatar -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu "$GPU" -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          for attempt in $(seq 1 120); do
            if adb -e get-state 2>/dev/null | grep -qx device; then break; fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            sleep 2
          done
          timeout 400 bash -c 'until [ "$(adb -e shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          # steadier taps and screenshots: no animations, screen stays on, portrait
          adb -e shell settings put global window_animation_scale 0
          adb -e shell settings put global transition_animation_scale 0
          adb -e shell settings put global animator_duration_scale 0
          adb -e shell svc power stayon true
          adb -e shell input keyevent 82 || true
          echo "abi: $(adb -e shell getprop ro.product.cpu.abilist | tr -d '\r')"
          # the screen is turned by the tests themselves (Emu.turn, -e orientation): adb user_rotation did not turn API 30
          adb -e shell wm size; adb -e shell wm density

      - name: Install the app and the tests from this run
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/default/debug -name '*arm64-v8a*.apk' -print -quit)
          [ -n "$APK" ] || APK=$(find app/build/outputs/apk/default/debug -name '*universal*.apk' -print -quit)
          TAPK=$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)
          echo "app: $APK"; echo "tests: $TAPK"
          adb -e install -r -g "$APK"
          adb -e install -r "$TAPK"

      - name: Run the avatar tests
        id: run
        timeout-minutes: 35
        env:
          MSAA: ${{ inputs.msaa || '4' }}
          ORIENT: ${{ inputs.orientation || 'portrait' }}
          TESTS: ${{ inputs.tests || 'all' }}
          FAULT: ${{ inputs.fault || 'none' }}
        run: |
          set +e -uo pipefail   # (Actions runs bash -e: a lost device must still leave its logs)
          case "$TESTS" in
            draw) CLASSES=cc.joycreator.avatar.emu.AvatarDrawParityTest ;;
            room) CLASSES=cc.joycreator.avatar.emu.AvatarRoomSmokeTest ;;
            studio) CLASSES=cc.joycreator.avatar.emu.AvatarStudioDrawTest ;;
            face) CLASSES=cc.joycreator.avatar.emu.AvatarFaceReplayTest ;;
            all)  CLASSES=cc.joycreator.avatar.emu.AvatarDrawParityTest,cc.joycreator.avatar.emu.AvatarRoomSmokeTest,cc.joycreator.avatar.emu.AvatarStudioDrawTest,cc.joycreator.avatar.emu.AvatarFaceReplayTest ;;
            *)    [[ "$TESTS" =~ ^[A-Za-z]+$ ]] || { echo "tests: all, draw, room, studio, face or one test class name"; exit 1; }
                  CLASSES="cc.joycreator.avatar.emu.$TESTS" ;;
          esac
          ARGS=(-e class "$CLASSES" -e msaa "$MSAA" -e orientation "$ORIENT")
          [ "$FAULT" != none ] && ARGS+=(-e fault "$FAULT")
          mkdir -p emu-out
          timeout 30 adb -e logcat -c
          adb -e logcat -v time > emu-out/logcat-live.txt 2>&1 &   # kept even if the emulator dies mid-test
          timeout 1500 adb -e shell am instrument -w -r "${ARGS[@]}" "$PKG.test/$RUNNER_CLASS" | tee emu-out/instrument.txt
          echo "instrument exit: ${PIPESTATUS[0]}; device: $(timeout 20 adb -e get-state 2>&1)" | tee emu-out/device.txt
          # every adb call from here has a time limit: a frozen emulator must not hold the run (it once held it 2 hours)
          timeout 60 adb -e logcat -d > emu-out/logcat.txt || true
          timeout 60 adb -e logcat -d -s AvatarEmu:V TestRunner:V AndroidRuntime:E > emu-out/avatar-log.txt || true
          [ -s emu-out/avatar-log.txt ] || grep -E ' (I|W|E)/(AvatarEmu|TestRunner|AndroidRuntime)' emu-out/logcat-live.txt > emu-out/avatar-log.txt || true
          # the pictures the tests saved in the app's own files
          timeout 120 adb -e exec-out run-as "$PKG" tar -cf - files/avatar-emu > "$RUNNER_TEMP/emu.tar" && tar -xf "$RUNNER_TEMP/emu.tar" -C emu-out || true
          kill %1 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" emu-out/ 2>/dev/null || true
          [ -d emu-out/files/avatar-emu ] && mv emu-out/files/avatar-emu emu-out/pictures && rmdir emu-out/files || true
          if grep -q '^OK (' emu-out/instrument.txt; then result=pass; else result=fail; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "### Avatar emulator: $result (tests=$TESTS, fault=$FAULT, msaa=$MSAA, ${{ inputs.device || 'pixel_4' }} ${{ inputs.orientation || 'portrait' }}, ${{ inputs.gpu || 'guest' }}) @ ${{ steps.meta.outputs.sha }}"
            echo '```'
            grep -E '^(OK|FAILURES|Tests run|INSTRUMENTATION_|Error)' emu-out/instrument.txt | head -20
            sed -n '/draw parity/,/^$/p;/room smoke/,/^$/p;/studio draw/,/^$/p' emu-out/avatar-log.txt | sed 's/^[^:]*: //' | head -60
            echo '```'
            if [ "$result" = fail ]; then
              echo 'Failure:'; echo '```'; cat emu-out/device.txt
              grep -A12 -E '^(INSTRUMENTATION_STATUS: stack=|INSTRUMENTATION_RESULT|There w)' emu-out/instrument.txt | head -40
              echo '--- emulator log, last lines'; tail -25 emu-out/emulator.log; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD > emu-out/COMMIT.txt
          { echo "result=$result"; echo "tests=$TESTS"; echo "fault=$FAULT"; echo "screen=${{ inputs.device || 'pixel_4' }} ${{ inputs.orientation || 'portrait' }}"; } > emu-out/RESULT.txt

      - name: Upload pictures and logs (kept 3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-emulator-${{ steps.meta.outputs.sha }}-${{ inputs.fault || 'none' }}${{ steps.meta.outputs.shape }}
          path: emu-out/
          retention-days: 3
          if-no-files-found: warn

      - name: Fail the run when a test failed
        if: steps.run.outputs.result != 'pass'
        run: |
          echo "avatar emulator tests failed; see the summary and the artifact"
          exit 1
