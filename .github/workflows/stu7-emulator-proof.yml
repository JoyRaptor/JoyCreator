name: STU-7 emulator diagnostic
on:
  push:
    branches: [codex/stu7-flow-verify-20261123]
    paths: [.github/workflows/stu7-emulator-proof.yml]
permissions:
  contents: read
  actions: read
jobs:
  decoded-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '45679205318'
      SOURCE_COMMIT: 'f1b661ed797c1438d49191b6283c765de957bd85'
    steps:
      - name: Configure emulator
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'emulator' 'platform-tools' 'system-images;android-30;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/stu7-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name stu7 --package 'system-images;android-30;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/stu7.ini"
          "$ANDROID_HOME/emulator/emulator" -avd stu7 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          for attempt in {1..120}; do
            if adb -e get-state 2>/dev/null | grep -qx device; then break; fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            sleep 2
          done
          if ! adb -e get-state | grep -qx device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          timeout 300 bash -c 'until [ "$(adb -e shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
      - name: Fetch pinned APK
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if gh run download --repo "$GITHUB_REPOSITORY" "$SOURCE_RUN" --name "joycreator-defaultDebug-${SOURCE_COMMIT:0:9}" --dir "$RUNNER_TEMP/stu7-apk"; then break; fi
            sleep 10
          done
          test "$(cat "$RUNNER_TEMP/stu7-apk/COMMIT.txt")" = "$SOURCE_COMMIT"
          apk=$(find "$RUNNER_TEMP/stu7-apk" -name '*.apk' -print -quit)
          test -n "$apk"
          adb -e shell getprop ro.product.cpu.abilist
          adb -e install "$apk"
      - name: Verify indexed P and B frames
        run: |
          set -euo pipefail
          adb -e logcat -c
          adb -e shell pm path com.fadcam.beta | grep -q '^package:'
          launch=$(timeout 60 adb -e shell am start -W -n com.fadcam.beta/com.fadcam.ui.faditor.motion.MotionFlowBenchActivity --ez decoded true)
          printf '%s\n' "$launch"
          grep -q '^Status: ok' <<< "$launch"
          for attempt in {1..60}; do
            adb -e logcat -d -s MotionFlowBench AndroidRuntime > "$RUNNER_TEMP/stu7-logcat.txt"
            if grep -qE 'DECODED_FAIL|FATAL EXCEPTION' "$RUNNER_TEMP/stu7-logcat.txt"; then
              cat "$RUNNER_TEMP/stu7-logcat.txt"
              exit 1
            fi
            if grep -q 'DECODED_PASS:' "$RUNNER_TEMP/stu7-logcat.txt"; then
              cat "$RUNNER_TEMP/stu7-logcat.txt"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/stu7-logcat.txt"
          exit 1
      - name: Print boot diagnostics on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/emulator.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stu7-emulator-diagnostic
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/stu7-logcat.txt
          retention-days: 3
