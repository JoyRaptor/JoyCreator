<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Joy Brush Media Lab</title>
<style>
  /* One dark working surface (deliberately single-theme): zinc greys, flat pills, a frosted strip over the paper. */
  :root { --ground: #232326; --panel: rgba(24, 24, 27, 0.8); --pill: #3f3f46; --ink: #e8e6e3; --muted: #a1a1aa; --err: #fca5a5; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; font: 13px system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; top: 8px; left: 8px; background: var(--panel); border-radius: 14px; padding: 8px 10px;
           display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: calc(100vw - 36px); backdrop-filter: blur(8px); }
  #panel label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
  select, button { background: var(--pill); color: var(--ink); border: 0; border-radius: 999px; padding: 5px 11px; font: inherit; }
  input[type=range] { width: 80px; }
  input[type=color] { width: 34px; height: 28px; border: 0; border-radius: 999px; padding: 0; background: none; }
  [hidden] { display: none !important; }   /* a control the brush does not use must actually go away */
  .group { display: inline-flex; gap: 6px; align-items: center; }
  #wetread { color: var(--ink); min-width: 52px; text-align: center; }
  #readout { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  #tiltbox { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 4px; }
  #tiltpad { width: 92px; height: 92px; border-radius: 50%; background: var(--panel); backdrop-filter: blur(8px); position: relative; touch-action: none;
             box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
  #tiltknob { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--ink); pointer-events: none; }
  #tiltread { color: var(--muted); font-size: 12px; background: var(--panel); border-radius: 999px; padding: 2px 8px; }
  .err { position: fixed; bottom: 0; left: 0; right: 0; color: var(--err); background: var(--ground); margin: 0; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <select id="tool" title="Brush"></select>
  <input id="color" type="color" value="#3860bf" title="Paint colour (watercolour)">
  <select id="paper" title="Paper surface"></select>
  <button id="dry" title="Let all the wet paint dry where it lies">Dry</button>
  <label title="Vector: strokes are kept as pen records, redrawn sharp when you zoom in, and can be recoloured or removed"><input id="vector" type="checkbox"> Vector</label>
  <button id="recolor" title="Vector: give the last stroke the current colour (it is redrawn with the same physics)">Recolour last</button>
  <label title="Oil: keep the paint the brush picked up between strokes (off = clean, fresh load each stroke)"><input id="dirtybrush" type="checkbox"> Dirty brush</label>
  <span id="bellybox" class="group"><button id="bellymode" title="Oil: what the brush belly is loaded with. Tap to change: off, your colour, darker, lighter, warmer, cooler, your last colour, or a slight random shift">Belly: off</button><input id="belly" type="color" value="#f2e6c8" title="Belly colour (manual)"></span>
  <span id="wetbox" class="group"><button id="drier" title="Blot the brush: less water">Drier</button><span id="wetread">wet</span><button id="wetter" title="Dip the brush: more water">Wetter</button></span>
  <button id="undo" title="Undo the last stroke">Undo</button>
  <button id="clear" title="Clear the sheet">Clear</button>
  <button id="sheet" title="Draw the fixed pencil test sheet">Test sheet</button>
  <label title="How far your pen tilts when you lay it on its side">Side at <input id="reach" type="range" min="30" max="85" value="68"></label>
  <label title="Lamp across the paper relief">Relief <input id="relief" type="range" min="0" max="200" value="30"></label>
  <label title="Mouse only: pressure">Mouse p <input id="mp" type="range" min="1" max="100" value="50"></label>
  <label title="Mouse only: tilt">Mouse tilt <input id="mt" type="range" min="0" max="80" value="0"></label>
  <select id="mode" title="What to show">
    <option value="0">Final</option><option value="1">Paper height</option><option value="2">Deposit</option><option value="3">Crush</option><option value="4">Water</option><option value="5">Floating pigment</option>
  </select>
  <span id="readout"></span>
</div>
<div id="tiltbox">
  <button id="phonetilt" title="Let the phone's own tilt run the water. Hold it however is comfortable, switch this on, then tip the phone">Phone tilt: off</button>
  <div id="tiltpad" title="Tilt the paper: drag to let wet paint run (the rim is upright); double-tap to level"><div id="tiltknob"></div></div>
  <span id="tiltread">level</span>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
