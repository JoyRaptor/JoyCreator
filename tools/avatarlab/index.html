<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Avatar Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-shaped app. Stage on top, the part you are working on underneath (beside it in landscape).
   Joy Creator's house style: old black, zinc greys, colour only to guide, ON = solid cyan, flat pills. */
:root{
  color-scheme:dark;
  --ground:#000000; --surface:#0d0d10; --panel:#111114; --raised:#1c1c22; --pressed:#26262e; --line:#2c2c35; --line2:#3a3a46;
  --ink:#e4e4e7; --dim:#a1a1aa; --faint:#71717a; --offink:#4b4b55; --off:#33333c;
  --sel:#22d3ee; --on-sel:#03181c; --live:#f43f8e; --warn:#fbbf24; --danger:#fa3d5d; --guide:#a78bfa;
  --go:#35f6bf; --go2:#97fe8b; --on-go:#050507; --room:#cc27ff; --room2:#7a2bff;
  --veil:rgba(13,13,16,.55);
  --f-disp:'Archivo','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#desk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#deskbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--dim);font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
#deskbar b{font:700 13px/1 var(--f-disp);letter-spacing:.02em;color:var(--ink);text-transform:none}
#deskbar .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--room),var(--room2))}
#devwrap{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center}
#device{position:relative;width:411px;height:846px;flex:none;border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 0 0 7px #08080a,0 0 0 8px var(--line);transform-origin:top center}
body.fill #desk{padding:0;gap:0} body.fill #deskbar{display:none}
body.fill #devwrap{align-items:stretch} body.fill #device{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}

#app{position:absolute;inset:0;display:flex;flex-direction:column}
#top{flex:none;height:46px;display:flex;align-items:center;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
#top .name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:999px;text-align:left}
#top .name:hover{background:var(--raised)}
#top .name i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--room),var(--room2));flex:none}
#top .name span{font:700 15px/1 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim);flex:none}
.ib:hover{background:var(--raised);color:var(--ink)} .ib:disabled{color:var(--off);cursor:default;background:none}
.ib.on{background:var(--sel);color:var(--on-sel)}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:2px;flex:none}
.seg button{height:28px;padding:0 12px;border-radius:999px;font:600 12px/1 var(--f-body);color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--sel);color:var(--on-sel)}
#modes button{height:30px;padding:0 14px;font:700 12px/1 var(--f-disp);letter-spacing:.02em}
#modes button.on.live{background:var(--live);color:#fff}

#body{flex:1;min-height:0;display:flex;flex-direction:column}
#app.land #body{flex-direction:row}
#stage{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 90% at 50% 38%,#1a1a22 0%,#0d0d10 62%,#050507 100%)}
#stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;opacity:.16;pointer-events:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#coach{position:absolute;left:10px;right:54px;top:8px;pointer-events:none;display:flex}
#coach span{background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:6px 10px;font:500 12px/1.35 var(--f-body);color:var(--ink);max-width:100%}
#coach span b{color:var(--sel);font-weight:600}
#coach.live span b{color:var(--live)}
#tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#tools .ib{background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);color:var(--ink)}
#tools .ib.on{background:var(--sel);color:var(--on-sel);border-color:transparent}
#stagebar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none}
#stagebar>*{pointer-events:auto}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#empty svg{height:min(86%,520px);width:auto;max-width:92%}

#panel{flex:none;height:47%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#app.land #panel{height:auto;width:46%;max-width:420px;min-width:300px;border-top:0;border-left:1px solid var(--line)}
#app.perform #panel{height:39%} #app.land.perform #panel{height:auto}
#panelhead{flex:none;display:flex;align-items:stretch;gap:10px;padding:8px 12px 8px;border-bottom:1px solid var(--line)}
#panelbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 18px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* the body map */
.bmap{flex:none;width:74px;height:92px}
.bmap .z{cursor:pointer}
.bmap .z .s{fill:none;stroke:var(--offink);stroke-width:2.2;stroke-dasharray:3 4;stroke-linecap:round;transition:all .15s}
.bmap .z.has .s{stroke:var(--dim);stroke-dasharray:none;fill:var(--raised)}
.bmap .z.line.has .s{fill:none;stroke-width:7;stroke-dasharray:none}
.bmap .z.line:not(.has) .s{stroke-width:7;stroke-dasharray:1 9}
.bmap .z:hover .s{stroke:var(--ink)}
.bmap .z.sel .s{stroke:var(--sel);fill:var(--sel);stroke-dasharray:none}
.bmap .z.line.sel .s{fill:none}
.bmap .plus{fill:var(--panel);stroke:var(--room);stroke-width:1.6}
.bmap .plus+path{stroke:var(--room);stroke-width:1.8;stroke-linecap:round}
.bmap.big .z .s{stroke-width:1.4;stroke-dasharray:4 5;stroke:var(--faint)} .bmap.big .z.line:not(.has) .s{stroke-width:5;stroke-dasharray:.1 8.5}
.bmap.big .lbl{font:600 5.2px/1 var(--f-mono);fill:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.ptitle{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ptitle h2{margin:0;font:800 19px/1.05 var(--f-disp);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptitle p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.35;text-wrap:pretty}
.ptitle .tabs{display:flex;gap:6px;margin-top:2px}
.badge{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--raised);color:var(--dim)}
.badge.ok{color:var(--go)} .badge.warn{color:var(--warn)}

.lab{font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.lab:first-child{margin-top:2px}
.lab::after{content:"";flex:1;height:1px;background:var(--line)}
.rowf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--raised);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--f-body);white-space:nowrap;flex:none}
.chip:hover{background:var(--pressed)} .chip.on{background:var(--sel);color:var(--on-sel);font-weight:600}
.chip.go{background:linear-gradient(90deg,var(--go),var(--go2));color:var(--on-go);font-weight:600}
.chip.live{background:var(--live);color:#fff;font-weight:600}
.chip.quiet{background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--dim)}
.chip.warn{color:var(--warn)} .chip:disabled{color:var(--offink);cursor:default;opacity:.5}
.chip svg.ic{width:15px;height:15px}
.chip.veil{background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.07)}
.chip.veil.on{background:var(--sel);border-color:transparent}
.sl{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:8px;min-height:32px}
.sl label{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl output{font:500 11px/1 var(--f-mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);margin-top:-7px;border:0}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:0}
.tg{display:flex;align-items:center;gap:10px;min-height:34px;width:100%;text-align:left}
.tg i{flex:none;width:34px;height:20px;border-radius:999px;background:var(--off);position:relative;transition:background .15s}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:all .15s}
.tg.on i{background:var(--sel)} .tg.on i::after{left:16px;background:var(--on-sel)}
.tg span{flex:1;min-width:0;font-size:12.5px} .tg small{display:block;color:var(--faint);font-size:11.5px;line-height:1.3}
.note{color:var(--dim);font-size:12.5px;line-height:1.4;margin:0 0 8px;text-wrap:pretty}
.note b{color:var(--ink);font-weight:600}

.thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{flex:none;width:58px;border-radius:10px;background:var(--raised);padding:3px;position:relative;text-align:center}
.th canvas{width:52px;height:52px;display:block;border-radius:8px;background:#0a0a0c}
.th span{display:block;font:500 9.5px/1.2 var(--f-mono);color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on{background:var(--sel)} .th.on span{color:var(--on-sel);font-weight:600}
.th .star{position:absolute;left:5px;top:5px;font-size:10px;color:var(--warn)}
.th.add{display:grid;place-items:center;height:76px;color:var(--room);box-shadow:inset 0 0 0 1.5px var(--line2);background:none;border-style:dashed}

.pad{position:relative;width:132px;height:132px;flex:none;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);touch-action:none;cursor:crosshair}
.pad canvas{width:100%;height:100%;display:block}
.padrow{display:flex;gap:12px;align-items:flex-start}
.padrow .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}

.doors{display:grid;gap:8px}
.door{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--raised);text-align:left;width:100%}
.door:hover{background:var(--pressed)}
.door .g{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--room),var(--room2));color:#fff}
.door .g svg.ic{width:22px;height:22px}
.door b{display:block;font:700 14px/1.2 var(--f-disp)} .door small{display:block;color:var(--dim);font-size:12px;line-height:1.3;margin-top:2px}
.door.plain .g{background:var(--pressed);color:var(--ink)}

.tree{font-size:12.5px}
.tr{display:flex;align-items:center;gap:6px;height:30px;border-radius:8px;padding-right:4px;cursor:pointer}
.tr:hover{background:var(--raised)} .tr.sel{background:var(--pressed);box-shadow:inset 2px 0 0 var(--sel)}
.tr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.hid .nm{color:var(--offink)} .tr .k{font:500 9.5px/1 var(--f-mono);letter-spacing:.05em;color:var(--guide);text-transform:uppercase;flex:none}
.tr .ey{width:26px;height:26px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:50%} .tr .ey:hover{color:var(--ink);background:var(--pressed)}
.tr .tw{width:16px;flex:none;color:var(--faint);text-align:center;font-size:10px}

/* perform */
.transport{display:flex;align-items:center;gap:8px}
.recb{width:44px;height:44px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none}
.recb i{width:18px;height:18px;border-radius:50%;background:var(--live);transition:all .15s}
.recb.on{background:var(--live)} .recb.on i{border-radius:4px;background:#fff;width:14px;height:14px}
.tl{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden;touch-action:none}
.tl canvas{width:100%;height:100%;display:block}
.talk{height:52px;flex:none;width:100%;border-radius:16px;background:var(--raised);font:700 14px/1 var(--f-disp);display:flex;align-items:center;justify-content:center;gap:8px;touch-action:none}
.talk.on{background:var(--live);color:#fff}
.meter{height:4px;border-radius:2px;background:var(--line2);overflow:hidden} .meter i{display:block;height:100%;width:0;background:var(--go)}

#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;display:none;flex-direction:column;z-index:21;background:rgba(17,17,20,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line2);border-radius:18px 18px 0 0}
#app.land #sheet{left:auto;width:min(440px,60%);top:0;max-height:none;border-radius:18px 0 0 18px;border-top:0;border-left:1px solid var(--line2)}
#sheet header{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
#sheet header h3{flex:1;margin:0;font:800 17px/1.1 var(--f-disp)}
#sheet .sb{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px}
#sheet footer{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#toast{position:absolute;left:50%;bottom:calc(47% + 12px);transform:translateX(-50%);z-index:30;background:rgba(28,28,34,.9);border:1px solid var(--line2);padding:8px 14px;border-radius:999px;font-size:12.5px;display:none;max-width:88%;text-align:center}
#app.land #toast{bottom:14px}
#full{position:absolute;inset:0;z-index:25;background:var(--surface);display:none;flex-direction:column}
#full header{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#full header h3{flex:1;margin:0;font:800 16px/1 var(--f-disp)}
#full .fb{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
#full .fb canvas{position:absolute;inset:0;width:100%;height:100%}
#full .ff{flex:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.menu{display:grid;gap:2px} .menu button{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border-radius:10px;text-align:left;font-size:14px;width:100%}
.menu button:hover{background:var(--raised)} .menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.menu small{color:var(--faint);margin-left:auto;font:500 10px/1 var(--f-mono)}
textarea,input[type=text],select{font:13px/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;width:100%}
select{height:32px;padding:0 8px;width:auto;border-radius:999px;background:var(--raised);border-color:transparent}
kbd{font:500 10px/1 var(--f-mono);padding:2px 5px;border-radius:5px;background:var(--pressed);color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="desk">
  <div id="deskbar">
    <span class="dot"></span><b>Avatar Studio</b><span>web pilot &middot; try it at phone size</span>
    <span class="seg" id="devseg" role="group" aria-label="Screen shape">
      <button data-d="tall" class="on" title="A phone held upright (Note 9 size)">Phone tall</button>
      <button data-d="wide" title="A phone held sideways">Phone wide</button>
      <button data-d="tab" title="A tablet">Tablet</button>
      <button data-d="fill" title="Use the whole window">Whole window</button>
    </span>
  </div>
  <div id="devwrap"><div id="device">
    <div id="app">
      <div id="top">
        <button class="ib" id="bmenu" title="Menu: open, save, new character"></button>
        <button class="name" id="bname" title="Rename this character"><i></i><span id="chname">Avatar Studio</span></button>
        <button class="ib" id="bundo" title="Undo (one press, one step)"></button>
        <button class="ib" id="bredo" title="Redo"></button>
        <span class="seg" id="modes" role="group" aria-label="Mode">
          <button data-m="build" class="on" title="Build: put the character together. Everything holds still so you can place pins.">Build</button>
          <button data-m="perform" title="Perform: everything is alive. Drag, talk, record.">Perform</button>
        </span>
      </div>
      <div id="body">
        <div id="stage">
          <canvas id="gl"></canvas><canvas id="ov"></canvas>
          <div id="empty"></div>
          <div id="coach"><span></span></div>
          <div id="tools"></div>
          <div id="stagebar"></div>
        </div>
        <div id="panel"><div id="panelhead"></div><div id="panelbody"></div></div>
      </div>
      <div id="scrim"></div>
      <div id="sheet"><header><h3></h3><button class="ib" id="sheetx" title="Close"></button></header><div class="sb"></div><footer></footer></div>
      <div id="full"></div>
      <div id="toast" role="status"></div>
    </div>
  </div></div>
</div>
<input type="file" id="filePsd" accept=".psd,.psb,image/vnd.adobe.photoshop" hidden>
<input type="file" id="fileImg" accept="image/png,image/webp,image/jpeg" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileAudio" accept="audio/*" hidden>
<script src="al-psd.js"></script>
<script src="al-model.js"></script>
<script src="al-solve.js"></script>
<script src="al-gl.js"></script>
<script src="al-autorig.js"></script>
<script src="al-demo.js"></script>
<script src="al-walk.js"></script>
<script src="al-inputs.js"></script>
<script src="al-app.js"></script>
<script src="al-cards.js"></script>
<script src="al-bridge.js"></script>
<script src="al-perform.js"></script>
<script src="al-intake.js"></script>
<script>AL.app.boot();</script>
</body>
</html>
