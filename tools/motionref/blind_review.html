<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind motion blur review</title>
<style>
:root { color-scheme: dark; background: #111113; color: #e4e4e7; font: 16px/1.5 system-ui, sans-serif; }
body { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
article { border-top: 1px solid #484850; padding: 16px 0 28px; }
article h2 { margin-top: 0; }
.crops, .ratings { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ratings { grid-template-columns: repeat(3, minmax(0, 1fr)); }
figure { margin: 0; }
figcaption { font-weight: 650; }
img { display: block; width: 100%; height: auto; background: #0a0a0b; }
label { display: grid; gap: 4px; }
select, button { font: inherit; min-height: 44px; border-radius: 6px; }
select { background: #222226; color: inherit; border: 1px solid #71717a; padding: 0 6px; }
button { background: #55e0f9; color: #111113; border: 0; padding: 8px 14px; font-weight: 650; }
:focus-visible { outline: 2px solid #55e0f9; outline-offset: 3px; }
@media (max-width: 600px) { .ratings { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Blind motion blur review</h1>
<p>Compare each pair for double edges, streak thickness and direction, halos, and lost detail. Mark severe cut ghosts or alpha fringes on the side where you see them. A crop opens at full size when tapped.</p>
<form id="review">
  <div id="pairs"></div>
  <button type="submit" title="Save all completed ratings as a JSON file">Download completed ratings</button>
  <p id="status" role="status" aria-live="polite"></p>
</form>
<template id="pair">
  <article>
    <h2></h2>
    <div class="crops">
      <figure><figcaption>A</figcaption><a target="_blank" rel="noopener"><img loading="lazy" alt="Crop A"></a></figure>
      <figure><figcaption>B</figcaption><a target="_blank" rel="noopener"><img loading="lazy" alt="Crop B"></a></figure>
    </div>
    <div class="ratings">
      <label>Overall quality
        <select data-kind="preference" required>
          <option value="">Choose…</option>
          <option value="a">A is better</option>
          <option value="b">B is better</option>
          <option value="comparable">Comparable</option>
        </select>
      </label>
      <label>Severe cut ghost
        <select data-kind="cut" required></select>
      </label>
      <label>Severe alpha fringe
        <select data-kind="alpha" required></select>
      </label>
    </div>
  </article>
</template>
<script>
'use strict';
const packet = /* PACKET */ null;
const form = document.getElementById('review');
const status = document.getElementById('status');
if (!packet) {
  form.hidden = true;
  document.body.append('Open the index.html generated by blind_review.py prepare.');
} else {
  const container = document.getElementById('pairs');
  const template = document.getElementById('pair');
  const cropErrors = new Set();
  for (const id of packet.pairs) {
    const fragment = template.content.cloneNode(true);
    fragment.querySelector('article').dataset.pair = id;
    fragment.querySelector('h2').textContent = 'Pair ' + id.split('-')[1];
    for (const [index, link] of fragment.querySelectorAll('figure a').entries()) {
      const side = index === 0 ? 'a' : 'b';
      const path = 'pairs/' + id + '-' + side + '.png';
      link.href = path;
      link.title = 'Open crop ' + side.toUpperCase() + ' at full size';
      const image = link.querySelector('img');
      image.addEventListener('error', () => cropErrors.add(id));
      image.src = path;
    }
    for (const select of fragment.querySelectorAll('select:not([data-kind="preference"])')) {
      for (const [value, label] of [['', 'Choose…'], ['neither', 'Neither'], ['a', 'A'], ['b', 'B'], ['both', 'Both']]) {
        select.add(new Option(label, value));
      }
    }
    container.append(fragment);
  }
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (cropErrors.size) {
      status.textContent = 'Missing crops in ' + Array.from(cropErrors).join(', ') + '. Reopen the complete review folder.';
      return;
    }
    const ratings = {};
    for (const card of container.querySelectorAll('article')) {
      ratings[card.dataset.pair] = Object.fromEntries(
        Array.from(card.querySelectorAll('select'), select => [select.dataset.kind, select.value])
      );
    }
    const output = JSON.stringify({packet: packet.packet, ratings}, null, 2) + '\n';
    const url = URL.createObjectURL(new Blob([output], {type: 'application/json'}));
    const download = document.createElement('a');
    download.href = url;
    download.download = 'motion-blur-ratings.json';
    document.body.append(download);
    download.click();
    download.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = 'Ratings download requested for all ' + packet.pairs.length + ' pairs.';
  });
}
</script>
</body>
</html>
