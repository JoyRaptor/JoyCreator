<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpriteLab Mobile — full feature merge, four layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507; --panel:#111114; --ctl:#1c1c22; --ctl2:#262630; --line:#2c2c35;
  --ink:#e4e4e7; --dim:#a1a1aa; --dimmer:#71717a;
  --cyan:#22d3ee; --pink:#f43f8e; --amber:#fbbf24; --green:#34d399;
  --blue:#60a5fa; --violet:#a78bfa;
  --r:14px; --r2:11px; --pill:999px;
  --disp:"Outfit",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --drawer:rgba(17,17,20,.88);      /* translucent ON PURPOSE — the video shows through */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#08080b;color:var(--ink);
  font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:var(--ctl);border:1px solid var(--line);
  border-radius:var(--pill);padding:4px 11px;cursor:pointer;min-height:29px;
  display:inline-flex;align-items:center;gap:5px;user-select:none;white-space:nowrap}
button:hover{background:var(--ctl2)}
button.on{background:var(--cyan);border-color:var(--cyan);color:#09090b;font-weight:600}
button.pk{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
button.sm{min-height:25px;padding:2px 9px;font-size:11px}
button.ic{padding:4px;min-width:29px;justify-content:center}
.seg{display:inline-flex;background:var(--ctl);border:1px solid var(--line);
  border-radius:var(--pill);padding:2px;gap:1px;flex:0 0 auto}
.seg button{border:0;background:transparent;min-height:24px;padding:2px 9px;
  color:var(--dimmer);font-size:11px}
.seg button.on{background:var(--cyan);color:#09090b}
.seg button.on.a{background:var(--amber)} .seg button.on.v{background:var(--violet)}
.seg button.on.p{background:var(--pink);color:#fff}
input[type=text]{background:#0b0b0e;border:1px solid var(--line);border-radius:var(--pill);
  padding:5px 11px;width:100%;color:inherit;font:inherit;font-size:11.5px}

/* page chrome */
header{position:sticky;top:0;z-index:30;background:#08080b;border-bottom:1px solid var(--line);
  padding:11px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font:800 16px/1 var(--disp);letter-spacing:-.02em}
.brand b{color:var(--cyan)} .brand i{color:var(--pink);font-style:normal}
.brand u{color:var(--amber);text-decoration:none}
.lbl{font:600 9.5px/1 var(--disp);letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer)}
main{padding:20px 18px 70px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;
  justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:9px}
.cap{max-width:392px}
.cap h4{margin:0 0 4px;font:600 14px/1.2 var(--disp)}
.cap p{margin:0 0 7px;font-size:11.5px;color:var(--dimmer);line-height:1.55}
.tally{display:flex;gap:5px;flex-wrap:wrap}
.pip2{font:600 9.5px/1.8 var(--disp);letter-spacing:.05em;text-transform:uppercase;
  padding:0 9px;border-radius:var(--pill)}
.g{background:#34d39922;color:var(--green)} .y{background:#fbbf2422;color:var(--amber)}
.r{background:#f43f8e22;color:var(--pink)} .c{background:#22d3ee1f;color:var(--cyan)}
.hint{font-size:10px;color:var(--dimmer);line-height:1.5}

/* phone */
.phone{width:392px;height:790px;background:var(--bg);border:9px solid #17171c;
  border-radius:38px;position:relative;overflow:hidden;flex:0 0 auto;box-shadow:0 20px 60px #000a}
.phone.sm{transform:scale(.58);transform-origin:top center;margin-bottom:-330px}
.sbar{height:24px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:9.5px;color:var(--dimmer)}
.scr{position:absolute;inset:24px 0 0 0;display:flex;flex-direction:column;overflow:hidden}
.tbar{height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:0 0 auto}
.tbar .t{font:600 14px/1 var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* modules */
.mod{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.band{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.band.nw{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.band.nw::-webkit-scrollbar{display:none}
.sp{flex:1}
.h3{font:600 10px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;color:#fff;padding:1px 0}
.h3 em{font-style:normal;color:var(--dimmer);font-size:9.5px;letter-spacing:0;text-transform:none}
.ico{font-size:12px}
.num{background:#0b0b0e;border:1px solid var(--line);border-radius:var(--pill);
  padding:3px 9px;display:flex;gap:5px;align-items:center;font-size:11px;cursor:ew-resize;
  flex:0 0 auto}
.num .k{color:var(--dimmer);font-size:9.5px} .num .v{font-weight:700;font-variant-numeric:tabular-nums}
.sw{width:24px;height:24px;min-width:24px;border-radius:var(--pill);border:2px solid var(--line);
  padding:0;cursor:pointer}

/* sources */
.srcs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.srcs::-webkit-scrollbar{display:none}
.src{flex:0 0 auto;border:2px solid var(--line);border-radius:var(--pill);padding:2px 9px;
  font-size:10.5px;display:flex;align-items:center;gap:5px;background:var(--ctl);cursor:pointer}
.src.on{border-color:var(--cyan)} .src .d{width:7px;height:7px;border-radius:50%}

/* grid */
.grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:8px;overflow:hidden}
.cell{background:#0c0c10;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  position:relative;font-size:25px;cursor:pointer;user-select:none}
.cell .n{position:absolute;left:3px;bottom:1px;font-size:8.5px;color:var(--dimmer)}
.cell .nm{position:absolute;right:3px;bottom:1px;font-size:8px;color:var(--cyan)}
.cell .vi{position:absolute;left:3px;top:2px;font-size:8px;color:var(--violet)}
.cell .sus{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;
  background:var(--amber)}
.cell.sel{outline:2px solid var(--cyan);outline-offset:-2px}
.cell.now{outline:2.5px solid var(--pink);outline-offset:-2px}
.cell .ord{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--cyan);
  color:#09090b;font:700 9.5px/1.5 system-ui;border-radius:4px;padding:0 5px}
.cell.now .ord{background:var(--pink);color:#fff}

/* preview */
.pv{background:repeating-conic-gradient(#3a3a45 0 25%,#212128 0 50%) 0 0/15px 15px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;
  overflow:hidden;flex:0 0 auto}
.pv .art{font-size:58px;filter:drop-shadow(0 0 9px #0008);position:relative;z-index:2}
.pv .hud{position:absolute;left:5px;bottom:4px;background:#000b;border-radius:5px;
  padding:2px 6px;font:600 9.5px/1 system-ui;z-index:3}
.pv .tag{position:absolute;left:5px;top:4px;background:var(--cyan);color:#09090b;
  border-radius:5px;padding:2px 7px;font:600 9.5px/1 system-ui;z-index:3}
.ghost{position:absolute;font-size:58px;opacity:.4;z-index:1}
.ghost.p{filter:sepia(1) saturate(7) hue-rotate(300deg);transform:translateX(-12px)}
.ghost.f{filter:sepia(1) saturate(7) hue-rotate(140deg);transform:translateX(12px)}
.pv .box{position:absolute;border:1.5px dashed var(--cyan);z-index:4;pointer-events:none}
.pv .hdl{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--cyan);z-index:5}
.pv .rot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--amber);z-index:5}
.pv .piv{position:absolute;z-index:5;color:var(--pink);font-size:13px;line-height:1}

/* scrub + film */
.scrub{height:20px;border:1px solid var(--line);border-radius:3px;background:#0b0b0e;
  display:flex;gap:1px;padding:2px;flex:0 0 auto;margin:0 7px}
.scrub i{border-radius:1px;background:#33333d}
.scrub i.on{background:var(--pink)}
.filmw{padding:5px 7px;display:flex;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.filmw::-webkit-scrollbar{display:none}
.filmw.mid{justify-content:center}
.film{background:#1a1a1f;border-radius:3px;display:inline-flex;flex-direction:column;flex:0 0 auto}
.sprock{height:9px;background:repeating-linear-gradient(90deg,#1a1a1f 0 6px,var(--bg) 6px 13px,#1a1a1f 13px 19px)}
.frames{display:flex;gap:4px;padding:3px}
.chip{width:42px;border:2px solid transparent;border-radius:7px;background:var(--ctl);
  padding:2px;text-align:center;cursor:pointer;flex:0 0 auto;position:relative}
.chip .im{font-size:21px;line-height:1.2} .chip .lb{font-size:7.5px;color:var(--dimmer)}
.chip .n2{font-size:7.5px;color:var(--cyan);overflow:hidden;white-space:nowrap}
.chip .hd{position:absolute;left:-2px;top:-3px;font-size:7.5px;color:#09090b;font-weight:700;
  background:var(--amber);border-radius:3px;padding:0 3px}
.chip.sel{border-color:var(--cyan)} .chip.now{background:var(--pink)}
.chip.now .lb{color:#3b0322}

/* clips */
.clip{background:var(--ctl);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;
  display:flex;gap:7px;align-items:center}
.clip .th{font-size:24px} .clip .mt{flex:1;min-width:0}
.clip .nm3{font:600 12px/1.2 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{display:inline-block;font:700 8px/1.6 system-ui;padding:0 5px;border-radius:3px;
  background:var(--violet);color:#09090b;vertical-align:1px}
.bdg.l{background:var(--cyan)} .bdg.o{background:var(--pink);color:#fff}

/* preset chips — the read-back door the phone never had */
.pchip{background:var(--violet);color:#09090b;border-radius:var(--pill);padding:3px 10px;
  font:700 11px/1.3 system-ui;display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  flex:0 0 auto}
.pchip.l{background:var(--cyan)} .pchip.o{background:var(--pink);color:#fff}

/* json */
.json{background:#0b0b0e;border:1px solid var(--line);border-radius:var(--r2);
  font:9.5px/1.5 Consolas,monospace;color:var(--dim);padding:6px;height:92px;overflow:auto}
.json b{color:var(--cyan);font-weight:400} .json u{color:var(--amber);text-decoration:none}

/* panes / tabs / sheets */
.panes{flex:1;overflow:hidden;position:relative}
.track{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.pane{width:100%;flex:0 0 100%;padding:7px 9px;overflow-y:auto;display:flex;
  flex-direction:column;gap:7px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.ptabs{display:flex;gap:3px;padding:4px 9px;flex:0 0 auto}
.ptabs button{flex:1;justify-content:center;font-size:10.5px;padding:2px 4px;min-height:25px}
.dots{display:flex;gap:5px;justify-content:center;padding:3px;flex:0 0 auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--cyan);width:16px;border-radius:var(--pill)}
.sheetover{position:absolute;left:0;right:0;bottom:0;height:76%;background:var(--panel);
  border-top:1px solid var(--cyan);border-radius:var(--r) var(--r) 0 0;z-index:14;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;gap:6px;padding:9px}
.sheetover.open{transform:none}
.scrim{position:absolute;inset:0;background:#0009;z-index:13;opacity:0;pointer-events:none;
  transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}

/* B — floating preview */
.pip{position:absolute;width:158px;background:var(--panel);border:1px solid var(--cyan);
  border-radius:var(--r);padding:5px;z-index:9;box-shadow:0 12px 34px #000c;touch-action:none}
.pip .pv{height:106px}
.pip .bar{display:flex;align-items:center;gap:4px;padding:1px 1px 4px;cursor:grab}
.pip .bar .gg{flex:1;height:3px;background:var(--line);border-radius:2px}
.pip .rz{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 45%,var(--cyan) 45%,var(--cyan) 60%,transparent 60%)}

/* C — split */
.split{flex:1;display:grid;grid-template-rows:1fr 6px 300px;overflow:hidden}
.divider{background:var(--line);cursor:ns-resize;position:relative;touch-action:none}
.divider::after{content:'';position:absolute;left:50%;top:-5px;transform:translateX(-50%);
  width:46px;height:16px;border-radius:var(--pill);background:var(--ctl2);border:1px solid var(--line)}

/* D — inspector */
.insp{position:absolute;right:0;top:40px;bottom:0;width:62%;background:var(--panel);
  border-left:1px solid var(--cyan);transform:translateX(101%);z-index:11;
  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  gap:6px;padding:8px;overflow-y:auto;scrollbar-width:none}
.insp.open{transform:none}
.insp::-webkit-scrollbar{display:none}
.insp .grab{position:absolute;left:-9px;top:0;bottom:0;width:18px;cursor:ew-resize;touch-action:none}

/* editor mock + drawers */
.vid{flex:1;background:linear-gradient(155deg,#1b2740,#0d1220);display:flex;align-items:center;
  justify-content:center;font-size:66px;position:relative}
.tl{height:76px;background:#0a0a0d;border-top:1px solid var(--line);padding:5px 7px;
  display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.tape{height:21px;border-radius:6px;background:linear-gradient(90deg,#1f3350,#2a4468);
  display:flex;align-items:center;padding:0 7px;font-size:9px;color:#9fc4ee;position:relative}
.tape.s{background:linear-gradient(90deg,#3a2350,#53306e);color:#d6b8f2}
.ph{position:absolute;left:44%;top:0;bottom:0;width:2px;background:var(--pink);z-index:3}
.drawer{position:absolute;left:0;right:0;bottom:0;background:var(--drawer);
  backdrop-filter:blur(13px);border-top:1px solid var(--line);z-index:10;
  border-radius:var(--r) var(--r) 0 0;transition:height .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden}
.grip{height:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  cursor:ns-resize;touch-action:none}
.grip i{width:36px;height:4px;border-radius:2px;background:#52525b;display:block}
.drow{display:flex;align-items:center;gap:5px;padding:0 8px 4px;flex:0 0 auto}
.drow.nw{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.drow.nw::-webkit-scrollbar{display:none}
.kf{display:inline-flex;align-items:center;gap:1px;background:var(--ctl);border:1px solid var(--line);
  border-radius:var(--pill);padding:1px;flex:0 0 auto}
.kf span{padding:2px 7px;font-size:11px;color:var(--dim);cursor:pointer;border-radius:var(--pill)}
.kf span.armed{color:#fff;background:var(--pink)}
.mini{font-size:10px;color:var(--dim);white-space:nowrap}
.inst{background:var(--violet);color:#09090b;font-weight:700;border-radius:var(--pill);
  padding:2px 10px;font-size:10.5px;flex:0 0 auto}
.rail{display:flex;flex-direction:column;gap:3px;padding:0 6px 5px 2px;flex:0 0 auto}
.rail button{min-height:23px;padding:1px 7px;font-size:10.5px;justify-content:center}
.dtabs{display:flex;gap:3px;padding:0 8px 4px;flex:0 0 auto}
.dtabs button{flex:1;justify-content:center;font-size:10.5px;min-height:24px;padding:1px}
.more{position:absolute;right:8px;bottom:44px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:6px;display:none;flex-direction:column;gap:3px;z-index:16;
  box-shadow:0 14px 40px #000c;min-width:180px}
.more.open{display:flex}
.more button{justify-content:flex-start;font-size:11px;min-height:26px}
</style>
</head>
<body>

<header>
  <div class="brand">Sprite<b>L</b><i>a</i><u>b</u> · full merge</div>
  <div style="display:flex;align-items:center;gap:7px">
    <span class="lbl">Lab</span>
    <div class="seg" id="labSeg">
      <button data-v="A" class="on">A panes</button><button data-v="B">B float</button>
      <button data-v="C">C split</button><button data-v="D">D inspector</button></div>
  </div>
  <div style="display:flex;align-items:center;gap:7px">
    <span class="lbl">Drawer</span>
    <div class="seg" id="drwSeg">
      <button data-v="1" class="on">1 rows</button><button data-v="2">2 rail</button>
      <button data-v="3">3 tabs</button><button data-v="4">4 minimal</button></div>
  </div>
  <button id="bCompare">Compare all</button>
  <span class="hint" id="invCount"></span>
</header>

<main id="stage"></main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const q = (s,r=document) => r.querySelector(s);
const qa = (s,r=document) => [...r.querySelectorAll(s)];

/* ══════════════════════════════════════════════════════════════════════
   ONE INVENTORY, FOUR ARRANGEMENTS.
   Every control from the SpriteLab web app AND from the phone's sprite
   drawer + sheet editor is defined once, as a module. Each layout only
   decides WHERE a module goes — never whether it exists. The tally under
   each phone counts what that arrangement had to put behind a tap.
   ══════════════════════════════════════════════════════════════════════ */

const FACES = ['😀','😉','😮','😢','😠','😐','😍','😴','🤔','😅','😳','🤩','😝','🥺','😎','🙃'];
const NAMES = {1:'smile',3:'surprised',4:'angry',6:'love',11:'excited',13:'plead'};
const VIS   = {1:'EE',3:'OO',5:'REST'};
const SUSPECT = {9:1};
const st = {
  sel:3, now:2, seq:[0,1,3,6,3,11], holds:{2:3}, detent:1,
  clips:[{n:'idle',t:'loop',f:4,fps:8,i:0},{n:'talk',t:'pingpong',f:6,fps:12,i:1},
         {n:'surprise',t:'once',f:3,fps:10,i:3}],
  paneIdx:0, dTab:0, iTab:0
};
const curCell = () => st.seq[st.now] ?? 0;

/* ── modules ─────────────────────────────────────────────────────────── */
const M = {};

M.history = () => `<button class="ic sm" title="Undo">↶</button><button class="ic sm" title="Redo">↷</button>`;
M.project = () => `<div class="mod"><div class="h3"><span class="ico">💾</span>Project</div>
  <div class="band"><button class="sm">⊞ Load sheet</button><button class="sm">Save project</button>
  <button class="sm">Open project</button></div></div>`;

M.sources = () => `<div class="srcs">
  <div class="src on"><span class="d" style="background:var(--cyan)"></span>starguy.png<span style="color:var(--dimmer)">✕</span></div>
  <div class="src"><span class="d" style="background:var(--violet)"></span>starguy_b.png<span style="color:var(--dimmer)">✕</span></div>
  <div class="src" style="opacity:.45"><span class="d" style="background:#3f3f46"></span>old.png<span style="color:var(--dimmer)">↺</span></div>
  <div class="src">＋ merge sheet</div></div>`;

M.grid = (cols=4,n=16) => `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">
  ${Array.from({length:n},(_,i)=>{
    const ords = st.seq.map((c,k)=>c===i?k+1:0).filter(Boolean);
    const isNow = curCell()===i;
    return `<div class="cell ${st.sel===i?'sel':''} ${isNow?'now':''}" data-c="${i}">${FACES[i]}
      <span class="n">${i}</span>
      ${NAMES[i]?`<span class="nm">${NAMES[i]}</span>`:''}
      ${VIS[i]?`<span class="vi">${VIS[i]}</span>`:''}
      ${SUSPECT[i]?`<span class="sus" title="suspect"></span>`:''}
      ${ords.length?`<span class="ord">${ords.join(',')}</span>`:''}
    </div>`;}).join('')}</div>`;

M.slice = () => `<div class="mod">
  <div class="h3"><span class="ico" style="color:var(--amber)">▦</span>Grid &amp; slicing
    <em>103×103 px · 16 cells</em></div>
  <div class="band">
    <div class="num"><span class="k">cols</span><span class="v">4</span></div>
    <div class="num"><span class="k">rows</span><span class="v">4</span></div>
    <div class="num"><span class="k">zoom</span><span class="v">86%</span></div>
    <div class="num"><span class="k">mg x</span><span class="v">0</span></div>
    <div class="num"><span class="k">mg y</span><span class="v">0</span></div>
    <div class="num"><span class="k">sp x</span><span class="v">0</span></div>
    <div class="num"><span class="k">sp y</span><span class="v">0</span></div>
  </div>
  <div class="band">
    <button class="sm">⌕ Detect</button><button class="sm on">Grid</button>
    <button class="sm on">🏷 Names</button><button class="sm">Key</button>

function editorMock(rows){
  return `<div class="scr">
    <div class="vid">${FACES[curCell()]}
      <div style="position:absolute;left:10px;top:9px;font-size:10px;color:#7da3d0">preview</div></div>
    <div class="tl"><div class="tape">clip.mp4<span class="ph"></span></div>
      <div class="tape s">Starguy · sprite</div></div>
    <div class="drawer" id="drawer" style="height:${DH[DRW][rows-1]}px">${DRWS[DRW](rows)}</div>
  </div>`;
}

/* ── render ──────────────────────────────────────────────────────────── */
let LAB='A', DRW='1', compare=false;
const phone = (inner,cls='') =>
  `<div class="phone ${cls}"><div class="sbar"><span>7:43</span><span>▮▮▮</span></div>${inner}</div>`;
function capOf(m, px){
  return `<div class="cap"><h4>${m.h}</h4><p>${m.p}</p><div class="tally">
    <span class="pip2 g">${m.direct.length} on screen</span>
    ${m.one.length?`<span class="pip2 y">${m.one.length} one tap</span>`:''}
    ${m.two.length?`<span class="pip2 r">${m.two.length} two taps</span>`:''}
    ${m.flag?`<span class="pip2 c">${m.flag}</span>`:''}
    ${px?`<span class="pip2 c">${px}px tall</span>`:''}</div></div>`;
}
function render(){
  const s = $('stage');
  if(compare){
    s.innerHTML = Object.keys(LABS).map(k=>{const o=LAB;LAB=k;
        const h=`<div class="slot">${phone(LABS[k](),'sm')}${capOf(LABMETA[k])}</div>`;LAB=o;return h;}).join('')
      + Object.keys(DRWS).map(k=>{const o=DRW;DRW=k;
        const h=`<div class="slot">${phone(editorMock(1),'sm')}${capOf(DRWMETA[k],DH[k][0])}</div>`;
        DRW=o;return h;}).join('');
  } else {
    s.innerHTML = `<div class="slot">${phone(LABS[LAB]())}${capOf(LABMETA[LAB])}</div>`
      + `<div class="slot">${phone(editorMock(st.detent))}${capOf(DRWMETA[DRW],DH[DRW][st.detent-1])}</div>`;
  }
  wire();
  const m = LABMETA[LAB];
  $('invCount').textContent =
    `${m.direct.length + m.one.length + m.two.length} modules · the same set in every layout`;
}

function wire(){
  qa('.cell').forEach(c => c.onclick = () => { st.sel=+c.dataset.c;
    const i=st.seq.indexOf(st.sel); if(i>=0) st.now=i;
    if(LAB==='D'){ st.iTab=1; render(); q('#insp').classList.add('open'); return; } render(); });
  qa('.chip[data-f]').forEach(c => c.onclick = () => { const i=+c.dataset.f;
    if(i<st.seq.length){ st.now=i; st.sel=st.seq[i]; render(); } });

  qa('[data-open]').forEach(b => b.onclick = () => { const id=b.dataset.open;
    q('#'+id).classList.add('open'); q(`[data-scrim="${id}"]`).classList.add('open'); });
  qa('[data-close]').forEach(b => b.onclick = () => { const id=b.dataset.close;
    q('#'+id).classList.remove('open'); q(`[data-scrim="${id}"]`).classList.remove('open'); });
  qa('.scrim').forEach(s2 => s2.onclick = () => { s2.classList.remove('open');
    q('#'+s2.dataset.scrim).classList.remove('open'); });

  const track = $('track');
  if(track){
    const go = i => { st.paneIdx = Math.max(0,Math.min(3,i)); render(); };
    qa('button',$('ptabs')).forEach((b,k)=> b.onclick = () => go(k));
    let sx=null;
    track.parentElement.addEventListener('pointerdown', e => {
      if(e.target.closest('.cell,.chip,button,.num,.src,.pchip,input')) return; sx=e.clientX; });
    track.parentElement.addEventListener('pointerup', e => {
      if(sx===null) return; const d=e.clientX-sx; sx=null;
      if(Math.abs(d)>45) go(st.paneIdx + (d<0?1:-1)); });
  }
  const pip = $('pip');
  if(pip){
    const bar=q('.bar',pip), rz=q('.rz',pip); let m=null,r=null;
    bar.addEventListener('pointerdown',e=>{ m={x:e.clientX,y:e.clientY,l:pip.offsetLeft,t:pip.offsetTop};
      bar.setPointerCapture(e.pointerId); });
    bar.addEventListener('pointermove',e=>{ if(!m) return;
      pip.style.left=(m.l+e.clientX-m.x)+'px'; pip.style.top=(m.t+e.clientY-m.y)+'px'; });
    bar.addEventListener('pointerup',()=>m=null);
    rz.addEventListener('pointerdown',e=>{ r={x:e.clientX,w:pip.offsetWidth};
      rz.setPointerCapture(e.pointerId); e.stopPropagation(); });
    rz.addEventListener('pointermove',e=>{ if(!r) return;
      const w=Math.max(118,Math.min(340,r.w+e.clientX-r.x));
      pip.style.width=w+'px'; q('.pv',pip).style.height=Math.round(w*.7)+'px'; });
    rz.addEventListener('pointerup',()=>r=null);
    $('pipToggle').onclick = e => { const on = pip.style.display!=='none';
      pip.style.display = on?'none':'block'; e.currentTarget.classList.toggle('on',!on); };
  }
  const div = $('divider');
  if(div){
    const split=$('split');
    const set = px => split.style.gridTemplateRows = `1fr 6px ${Math.max(150,Math.min(500,px))}px`;
    let dy=null,h0=0;
    div.addEventListener('pointerdown',e=>{ dy=e.clientY; h0=split.lastElementChild.offsetHeight;
      div.setPointerCapture(e.pointerId); });
    div.addEventListener('pointermove',e=>{ if(dy===null) return; set(h0-(e.clientY-dy)); });
    div.addEventListener('pointerup',()=>dy=null);
    qa('button',$('ctabs')).forEach((b,i)=> b.onclick = () => { st.dTab=i; render(); });
  }
  const insp = $('insp');
  if(insp){
    $('inspToggle').onclick = () => insp.classList.toggle('open');
    $('inspClose').onclick = () => insp.classList.remove('open');
    qa('#itabs button').slice(0,3).forEach((b,i)=> b.onclick = () => { st.iTab=i; render();
      q('#insp').classList.add('open'); });
    const grab=$('inspGrab'); let gx=null,w0=0;
    grab.addEventListener('pointerdown',e=>{ gx=e.clientX; w0=insp.offsetWidth;
      grab.setPointerCapture(e.pointerId); });
    grab.addEventListener('pointermove',e=>{ if(gx===null) return;
      insp.style.width=Math.max(170,Math.min(370,w0-(e.clientX-gx)))+'px'; });
    grab.addEventListener('pointerup',()=>gx=null);
  }
  const grip = q('.drawer .grip');
  if(grip){
    let gy=null;
    grip.addEventListener('pointerdown',e=>{ gy=e.clientY; grip.setPointerCapture(e.pointerId); });
    grip.addEventListener('pointerup',e=>{ if(gy===null) return; const d=gy-e.clientY; gy=null;
      if(d>22) st.detent=Math.min(3,st.detent+1);
      else if(d<-22) st.detent=Math.max(1,st.detent-1); else return; render(); });
  }
  const mb = $('moreBtn'); if(mb) mb.onclick = () => $('moreMenu').classList.toggle('open');
  const dt = $('dtabs'); if(dt) qa('button',dt).forEach(b => b.onclick = () => {
    qa('button',dt).forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
}

$('labSeg').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  LAB=b.dataset.v; qa('button',$('labSeg')).forEach(x=>x.classList.toggle('on',x===b));
  compare=false; $('bCompare').classList.remove('on'); st.paneIdx=0; st.dTab=0; st.iTab=0; render(); };
$('drwSeg').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  DRW=b.dataset.v; qa('button',$('drwSeg')).forEach(x=>x.classList.toggle('on',x===b));
  compare=false; $('bCompare').classList.remove('on'); render(); };
$('bCompare').onclick = e => { compare=!compare;
  e.currentTarget.classList.toggle('on',compare); render(); };
render();
</script>
</body>
</html>
